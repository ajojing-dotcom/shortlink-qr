<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Dashboard KlikAje di HP</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@600;700&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B3202A}a:hover{color:#8E1B22}
input{font:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FBF4E6; color: #2B1A12; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 15px; line-height: 1.5; display: flex; flex-direction: column; overflow: hidden">

  <header style="background: #FFFFFF; border-bottom: 4px solid #B3202A; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between">
    <span style="display: flex; align-items: center; gap: 8px">
      <span style="width: 30px; height: 30px; border-radius: 8px; background: #B3202A; display: flex; align-items: center; justify-content: center">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>
      </span>
      <span style="font-family: 'Zilla Slab', sans-serif; font-weight: 700; font-size: 19px; letter-spacing: -0.02em">klik<span style="color: #0E6B47">aje</span></span>
    </span>
    <button type="button" aria-label="Buka menu" style="width: 44px; height: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2B1A12" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
  </header>
  <svg aria-hidden="true" width="100%" height="16" style="display: block"><defs><pattern id="gb-Mobile-dc" width="22" height="16" patternUnits="userSpaceOnUse"><path d="M0 0H22L11 11.5Z" fill="#B3202A"/><circle cx="11" cy="13" r="2.4" fill="#B3202A"/></pattern></defs><rect width="100%" height="16" fill="url(#gb-Mobile-dc)"/></svg>

  <div style="flex: 1; overflow: hidden; padding: 16px; display: flex; flex-direction: column; gap: 14px">
    <section aria-label="Buat shortlink" style="background: #FFFFFF; border: 1px solid #EADCC4; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
      <label for="m-url" style="font-weight: 600; font-size: 14px">Tempel link panjang di mari</label>
      <input id="m-url" type="url" placeholder="https://..." style="height: 46px; padding: 0 12px; border: 1.5px solid #D9C6A5; border-radius: 11px">
      <div style="display: flex; height: 46px; border: 1.5px solid #D9C6A5; border-radius: 11px; overflow: hidden">
        <span style="display: flex; align-items: center; padding: 0 10px; background: #FBF4E6; color: #6E5A4C; font-family: 'JetBrains Mono', monospace; font-size: 13px">klikaje.my.id/</span>
        <label for="m-slug" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Nama link</label>
        <input id="m-slug" type="text" placeholder="nama-link (opsional)" style="flex: 1; min-width: 0; border: 0; padding: 0 10px; font-family: 'JetBrains Mono', monospace; font-size: 13px; outline: none">
      </div>
      <button type="button" style="height: 48px; border: 0; border-radius: 12px; background: #B3202A; color: #FFFFFF; font: inherit; font-weight: 600; cursor: pointer">Pendekin, nyok!</button>
    </section>

    <div style="display: flex; align-items: center; justify-content: space-between">
      <h2 style="margin: 0; font-family: 'Zilla Slab', sans-serif; font-size: 19px; font-weight: 700">Daftar link</h2>
      <button type="button" aria-label="Cari link" style="width: 44px; height: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4A372B" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      </button>
    </div>

    <sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
      <article style="background: #FFFFFF; border: 1px solid #EADCC4; border-radius: 14px; padding: 12px 14px; display: flex; align-items: center; gap: 12px">
        <div style="flex: 1; min-width: 0">
          <div style="font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.title}}</div>
          <div style="font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #8E1B22">klikaje.my.id/{{r.slug}}</div>
          <div style="font-size: 13px; color: #6E5A4C">{{r.clicks}} klik · {{r.status}}</div>
        </div>
        <button type="button" aria-label="Salin link" style="width: 44px; height: 44px; border: 1.5px solid #D9C6A5; border-radius: 11px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#2B1A12" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h8"/></svg></button>
        <button type="button" aria-label="Lihat QR" style="width: 44px; height: 44px; border: 1.5px solid #D9C6A5; border-radius: 11px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#2B1A12" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><path d="M14 14h2v2h-2zM18 18h2v2h-2zM14 18v2M18 14h2"/></svg></button>
      </article>
    </sc-for>
  </div>

  <nav aria-label="Menu bawah" style="background: #FFFFFF; border-top: 1px solid #EADCC4; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 6px 16px 18px">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px; color: #8E1B22; font-size: 13px; font-weight: 600; text-decoration: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>
      Link
    </a>
    <a href="QR.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px; color: #6E5A4C; font-size: 13px; font-weight: 500; text-decoration: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><path d="M14 14h2v2h-2zM18 18h2v2h-2zM14 18v2M18 14h2"/></svg>
      QR
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      rows: [
        { title: 'Pendaftaran lomba 17-an', slug: 'daftar-lomba', clicks: '0', status: 'Aktif' },
        { title: 'Undangan arisan RT', slug: 'arisan-okt', clicks: '38', status: 'Aktif' },
        { title: 'Portofolio desain', slug: 'porto', clicks: '214', status: 'Aktif' },
        { title: 'Promo jualan kue', slug: 'kue-lebaran', clicks: '97', status: 'Kedaluwarsa' }
      ]
    };
  }
}
</script>
</body>
</html>
